```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simple Slay</title>

<style>
:root{
--bg:#080b14;
--panel:#111827;
--border:#2d3a52;
--text:#f5f7ff;
--accent:#7c5cff
}

*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
background:radial-gradient(circle at 50% -10%,#27355d,#11182a 35%,var(--bg) 72%);
color:var(--text);
font-family:Inter,system-ui,sans-serif
}

#game{
width:min(960px,calc(100% - 24px));
min-height:100vh;
margin:auto;
padding:28px 0
}

h1{
text-align:center;
font-size:clamp(30px,7vw,54px);
letter-spacing:.09em;
margin:4px 0 22px
}

#screen{
min-height:560px;
padding:28px;
white-space:pre-wrap;
line-height:1.6;
font:16px monospace;
background:linear-gradient(145deg,#182235,#0d121e);
border:1px solid var(--border);
border-radius:22px;
box-shadow:0 20px 60px #0007;
overflow:auto
}

#controls{
display:flex;
gap:10px;
margin-top:14px;
padding:12px;
background:#111827e8;
border:1px solid var(--border);
border-radius:16px
}

#input{
flex:1;
min-width:0;
background:#0b1020;
color:var(--text);
border:1px solid var(--border);
border-radius:10px;
padding:12px 14px;
font:inherit
}

button{
border:0;
border-radius:10px;
padding:12px 18px;
background:var(--accent);
color:#fff;
font-weight:bold;
font-size:15px;
cursor:pointer
}

button:hover{filter:brightness(1.2)}
button:disabled{opacity:.45;cursor:not-allowed}

@media(max-width:600px){
#game{
width:calc(100% - 16px);
padding:16px 0
}

#screen{
min-height:calc(100vh - 150px);
padding:20px 16px;
font-size:14px
}

#controls{padding:9px}
}
</style>
</head>

<body>

<div id="game">

<h1>SIMPLE SLAY</h1>

<div id="screen"></div>

<div id="controls">
<input id="input" type="number" inputmode="numeric" autofocus>
<button id="choose">Choose</button>
</div>

</div>

<script>
"use strict";

const screen=document.getElementById("screen"),
input=document.getElementById("input"),
btn=document.getElementById("choose");

let hp=100,gold=100,stars=0,level=1,potions=0;
let sword=false,epicSword=false,epicBow=false;

let state="main";
let currentLevel=0;
let currentEnemy=null;
let levelQueue=[];
let queueIndex=0;

const names=[
"",
"BAT",
"SLIME",
"SPIDER",
"GOBLIN",
"WOLF",
"OGRE",
"ZOMBIE",
"ARMORED ZOMBIE",
"DRAGON"
];

function maxHP(){
return 100+(level-1)*20;
}

function write(x=""){
screen.textContent+=x;
screen.scrollTop=screen.scrollHeight;
}

function clear(){
screen.textContent="";
}

function prompt(){
input.value="";
input.disabled=false;
btn.disabled=false;
input.focus();
}

function off(){
input.disabled=true;
btn.disabled=true;
}

function rnd(){
return Math.floor(Math.random()*100)+1;
}

function setType(t){
input.type=t;
input.inputMode=t=="number"?"numeric":"text";
}

function enemy(n,h,d,r){
return{
name:names[n],
enm:n,
hp:h,
damage:d,
reward:r
};
}


/* SAVE / LOAD */

function save(){

localStorage.setItem(
"simpleSlaySave",
JSON.stringify({
hp,
gold,
stars,
level,
potions,
sword,
epicSword,
epicBow
})
);

write("\nGame saved!\n");
}

function load(){

let s=localStorage.getItem("simpleSlaySave");

if(!s){
write("\nNo save found!\n");
return;
}

try{

({
hp,
gold,
stars,
level,
potions,
sword,
epicSword,
epicBow
}=JSON.parse(s));

currentLevel=0;
currentEnemy=null;
levelQueue=[];
queueIndex=0;

showMain();

write("Game loaded!\n");

}catch{

write("\nSave is corrupted!\n");

}
}


/* MAIN MENU */

function showMain(){

state="main";

clear();

write(`=== SIMPLE SLAY ===
Lvl: ${level} | Stars: ${stars} | Gold: ${gold}
1.Play  2.Shop  3.Inv  4.Save  5.Load  6.Quit
Choose: `);

setType("number");
prompt();

}


/* LEVEL SELECT */

function showLevels(){

state="levelSelect";

clear();

write("--- LEVEL SELECT ---\n");

for(let i=1;i<=10;i++)
write(`${i}. Level ${i}\n`);

write("11. Back\nChoose: ");

setType("number");
prompt();

}


/* BATTLE */

function fight(e){

currentEnemy={...e};

state="levelCombat";

clear();

write(`=== LEVEL ${currentLevel} ===

====================
${e.name}
====================
Enemy HP: ${e.hp} | Damage: ${e.damage} | Reward: ${e.reward}
`);

combatPrompt();

}

function combatPrompt(){

write(`
Your HP: ${hp} | Enemy HP: ${currentEnemy.hp}
1.Attack  2.Bow  3.Potion  4.Run
Choose: `);

setType("number");
prompt();

}

function redrawBattle(){

clear();

write(`=== LEVEL ${currentLevel} ===

====================
${currentEnemy.name}
====================
Enemy HP: ${currentEnemy.hp} | Damage: ${currentEnemy.damage} | Reward: ${currentEnemy.reward}
`);

combatPrompt();

}


/* COMBAT */

function combat(c){

const e=currentEnemy;

if(c==1||c==2){

let d=c==1
?(epicSword?30:sword?20:10)
:(epicBow?25:15);

if(rnd()<=25){

d*=2;

write("CRITICAL HIT!\n");

}

e.hp-=d;

write(`You dealt ${d} damage!\n`);

if(e.hp>0){

hp-=e.damage;

write(`Enemy hit you for ${e.damage} HP.\n`);

}

}

else if(c==3){

if(!potions){

write("No potions!\n");
combatPrompt();
return;
}
potions--
hp=Math.min(maxHP(),hp+85);

if(e.hp>0)
hp-=e.damage;

}



else if(c==4){

write("Ran away!\n");

currentEnemy=null;

finish(false);

return;

}

else{

write("Invalid choice.\n");

combatPrompt();

return;

}


if(hp<=0){

write("\nDefeated!\n");

currentEnemy=null;

finish(false);

return;

}


if(e.hp<=0){

gold+=e.reward;
stars++;


/* UPDATE LEVEL FROM STARS */

if(stars>=27)
level=10;
else if(stars>=24)
level=9;
else if(stars>=21)
level=8;
else if(stars>=18)
level=7;
else if(stars>=15)
level=6;
else if(stars>=12)
level=5;
else if(stars>=9)
level=4;
else if(stars>=6)
level=3;
else if(stars>=3)
level=2;
else
level=1;


write(`
Victory! +${e.reward} coins, +1 star!
Gold: ${gold} | Stars: ${stars} | Level: ${level}
`);

currentEnemy=null;

finish(true);

return;

}

redrawBattle();

}


/* FINISH BATTLE */

function finish(won){

if(state=="levelCombat"){

if(!won){

finishLevel();

return;

}

queueIndex++;

if(queueIndex<levelQueue.length){

fight(levelQueue[queueIndex]);

}

else{

finishLevel();

}

}

else{

showMain();

}

}


/* LEVELS */

function startLevel(l){

currentLevel=l;

hp=maxHP();

clear();

write(`=== LEVEL ${l} ===\n\n`);


if(l==1){

levelQueue=[
enemy(2,50,10,100)
];

let r=rnd();

let n=r==1?9:r<=50?1:3;

levelQueue.push(
enemy(
n,
n==9?500:n==1?40:60,
n==9?100:n==1?12:15,
n==9?1000:n==1?100:125
)
);

}


else if(l==2){

levelQueue=[
enemy(4,75,15,150)
];

let r=rnd();

let n=r<=33?7:r<=66?1:5;

levelQueue.push(
enemy(
n,
n==7?150:n==1?40:80,
n==7?35:n==1?12:18,
n==7?175:n==1?100:175
)
);

}


else if(l==3){

levelQueue=[
enemy(5,80,18,175)
];

let r=rnd();

let n=r<=33?4:r<=66?6:8;

levelQueue.push(
enemy(
n,
n==4?75:n==6?100:250,
n==4?15:n==6?20:25,
n==4?150:n==6?250:225
)
);

}


else if(l==4){

levelQueue=[
enemy(6,100,20,250)
];

let r=rnd();

let n=r<=2?9:r<=34?2:r<=67?8:7;

levelQueue.push(
enemy(
n,
n==9?500:n==2?50:n==8?250:150,
n==9?100:n==2?10:n==8?25:35,
n==9?1000:n==2?100:n==8?225:175
)
);

}


else if(l>=5&&l<=9){

let loops=l==5||l==6?2:l==7?2:3;

levelQueue=[];

for(let i=0;i<loops;i++){

let n=Math.floor(Math.random()*8)+1;

let h=40,d=12,r=100;

if(n==2)
h=50,d=10;

else if(n==3)
h=60,d=15,r=125;

else if(n==4)
h=75,d=15,r=150;

else if(n==5)
h=80,d=18,r=175;

else if(n==6)
h=100,d=20,r=250;

else if(n==7)
h=150,d=35,r=175;

else if(n==8)
h=250,d=25,r=225;


if(l==7&&rnd()<=5){

n=9;
h=500;
d=100;
r=1000;

}


if(i==0&&l>=7){

n=l==7?7:8;
h=l==7?150:250;
d=l==7?35:25;
r=l==7?175:225;

}


if(i==1&&l>=8){

n=7;
h=150;
d=35;
r=175;

}


if(i==2&&l==9){

n=3;
h=60;
d=15;
r=125;

}

levelQueue.push(enemy(n,h,d,r));

}

}


else if(l==10){

levelQueue=[

enemy(9,500,100,1000),
enemy(8,250,25,225),
enemy(7,150,35,175),
enemy(6,100,20,250),
enemy(5,80,18,175)

];

}

queueIndex=0;

fight(levelQueue[0]);

}


/* FINISH LEVEL */

function finishLevel(){

hp=maxHP();

if(currentLevel==10)
write("\nYOU BEAT SIMPLE SLAY!\n");

currentLevel=0;
levelQueue=[];
queueIndex=0;

write("\n");

showMain();

}


/* SHOP */

function shopMenu(){

state="shop";

clear();

write(`--- SHOP ---
Coins: ${gold}

1.Sword - 100
2.Potion - 50
3.Mystery Box - 75
4.Epic Bow - 200
5.Back

Choose: `);

setType("text");
prompt();

}


function shop(v){

let c=v.trim().toLowerCase();


/* SECRET CODES */

if(!/^[1-5]$/.test(c)){

if(c=="qwerty12345"){

gold+=1000;

write("\nCODE ACCEPTED! +1000 coins!\n");

}


else if(c=="slayer666"){

stars+=10;


/* FIX: UPDATE LEVEL IMMEDIATELY */

if(stars>=27)
level=10;
else if(stars>=24)
level=9;
else if(stars>=21)
level=8;
else if(stars>=18)
level=7;
else if(stars>=15)
level=6;
else if(stars>=12)
level=5;
else if(stars>=9)
level=4;
else if(stars>=6)
level=3;
else if(stars>=3)
level=2;
else
level=1;

write(`\nCODE ACCEPTED! +10 stars! You are now Level ${level}!\n`);

}


else if(c=="godmode999"){

epicSword=true;
epicBow=true;
potions+=10;

write("\nCODE ACCEPTED! Epic Sword, Epic Bow and 10 potions!\n");

}


else{

write("\nInvalid choice.\n");

}

shopMenu();

return;

}


c=Number(c);


if(c==1){

if(sword||epicSword)

write("Owned!\n");

else if(gold>=100){

gold-=100;
sword=true;

write("Bought Sword!\n");

}

else

write("No cash!\n");

}


else if(c==2){

if(gold>=50){

gold-=50;
potions++;

write("Bought 1 Potion!\n");

}

else

write("No cash!\n");

}


else if(c==3){

if(gold<75){

write("No cash!\n");

}

else{

gold-=75;

let r=rnd();


if(r<=50){

potions++;

write("Mystery Box: You got 1 Potion!\n");

}


else if(r<=85){

if(!sword&&!epicSword){

sword=true;

write("Mystery Box: You got a Sword!\n");

}

else{

gold+=100;

write("Mystery Box: You got 100 coins!\n");

}

}


else{

epicSword=true;

write("Mystery Box: You got an Epic Sword!\n");

}

}

}


else if(c==4){

if(epicBow)

write("Owned!\n");

else if(gold>=200){

gold-=200;
epicBow=true;

write("Bought Epic Bow!\n");

}

else

write("No cash!\n");

}


else if(c==5){

showMain();

return;

}


shopMenu();

}


/* INVENTORY */

function invMenu(){

state="inventory";

clear();

write(`--- INV ---

1.Weapons
2.Items
3.Money
4.Back

Choose: `);

setType("number");
prompt();

}


function inventory(c){

if(c==1){

write(
`Melee: ${epicSword?"Epic Sword":sword?"Sword":"None"}
Ranged: ${epicBow?"Epic Bow":"None"}
`);

}


else if(c==2){

write(`Potions: ${potions}\n`);

}


else if(c==3){

write(`Coins: ${gold} | Stars: ${stars}\n`);

}


else if(c==4){

showMain();

return;

}


else{

write("Invalid choice.\n");

}

write("\n1.Weapons  2.Items  3.Money  4.Back\nChoose: ");

prompt();

}


/* LEVEL LOCKS */

function chooseLevel(l){

const locks={
2:3,
3:6,
4:9,
5:12,
6:15,
7:18,
8:21,
9:24,
10:27
};

if(l==11)
return showMain();

if(l<1||l>10)
return showLevels();

if(locks[l]!==undefined&&stars<locks[l]){

write(`Locked! Need ${locks[l]} stars.\n`);

return showLevels();

}

startLevel(l);

}


/* INPUT */

function submit(){

const v=input.value.trim();

if(state=="shop"){

shop(v);

return;

}

const n=Number(v);

if(!Number.isInteger(n)){

write("Invalid choice.\n");

prompt();

return;

}


switch(state){

case"main":

n==1?showLevels():
n==2?shopMenu():
n==3?invMenu():
n==4?save():
n==5?load():
n==6?off():
(write("Invalid choice.\n"),prompt());

break;


case"levelSelect":

chooseLevel(n);

break;


case"levelCombat":

combat(n);

break;


case"inventory":

inventory(n);

break;

}

}


btn.onclick=submit;

input.onkeydown=e=>{

if(e.key=="Enter")
submit();

};


showMain();

</script>

</body>
</html>
```
